name: Build Apple Silicon macOS installer

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/desktop-macos-arm64.yml'
      - 'apps/**'
      - 'packages/**'
      - 'native/**'
      - 'vendor/**'
      - 'scripts/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: desktop-macos-arm64
  cancel-in-progress: false

env:
  NODE_VERSION: '24'
  RELEASE_TAG: desktop-macos-v0.1.0-rc.7

jobs:
  build:
    name: Build macOS arm64 DMG
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Apple Silicon DMG
        run: pnpm --dir apps/desktop run package:mac-arm64

      - name: Verify artifact architecture
        run: |
          set -euo pipefail
          artifact=DeepSeek-Harness-0.1.0-rc.7-mac-arm64.dmg
          artifact_dir=release/desktop
          mount_dir="$RUNNER_TEMP/deepseek-harness-dmg"
          test -f "$artifact_dir/$artifact"
          mkdir -p "$mount_dir"
          hdiutil attach -readonly -nobrowse -mountpoint "$mount_dir" "$artifact_dir/$artifact"
          trap 'hdiutil detach "$mount_dir" >/dev/null 2>&1 || true' EXIT
          executable="$mount_dir/DeepSeek Harness.app/Contents/MacOS/DeepSeek Harness"
          test -x "$executable"
          architectures="$(lipo -archs "$executable")"
          echo "Packaged executable architectures: $architectures"
          grep -qw arm64 <<< "$architectures"
          if [[ " $architectures " == *" x86_64 "* ]]; then
            echo "::error::Expected a native arm64-only executable, found: $architectures"
            exit 1
          fi
          hdiutil detach "$mount_dir"
          trap - EXIT
          (cd "$artifact_dir" && shasum -a 256 "$artifact" | tee "$artifact.sha256")

      - name: Upload build artifact
        uses: actions/upload-artifact@v6
        with:
          name: DeepSeek-Harness-0.1.0-rc.7-mac-arm64
          path: |
            release/desktop/DeepSeek-Harness-0.1.0-rc.7-mac-arm64.dmg
            release/desktop/DeepSeek-Harness-0.1.0-rc.7-mac-arm64.dmg.sha256
          if-no-files-found: error

      - name: Attach DMG to macOS Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          files: |
            release/desktop/DeepSeek-Harness-0.1.0-rc.7-mac-arm64.dmg
            release/desktop/DeepSeek-Harness-0.1.0-rc.7-mac-arm64.dmg.sha256
          fail_on_unmatched_files: true
          overwrite_files: true
